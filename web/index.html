<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DasVisable - DHF / Thermal 模型查看器</title>
  <link rel="stylesheet" href="vendor/cesium/Widgets/widgets.css" />
  <link rel="stylesheet" href="css/main.css" />
  <script>
    window.CESIUM_BASE_URL = "vendor/cesium/";
  </script>
</head>
<body>
  <div id="cesiumContainer"></div>

  <div id="toolbar">
    <h1>DasVisable</h1>
    <div class="model-group" id="modelGroup" role="group" aria-label="模型选择"></div>
    <div class="detection-group" id="detectionGroup" role="group" aria-label="检测框">
      <label class="detection-toggle detection-master">
        <input type="checkbox" id="detectionToggleAll" checked />
        <span>检测框</span>
      </label>
    </div>
    <div id="status">正在初始化 Cesium...</div>
  </div>

  <div id="hint">鼠标左键旋转 · 滚轮缩放 · 右键平移</div>

  <script src="vendor/cesium/Cesium.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
