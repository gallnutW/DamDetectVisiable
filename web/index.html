<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DasVisable - DHF / Thermal 模型查看器</title>
  <link rel="stylesheet" href="vendor/cesium/Widgets/widgets.css" />
  <link rel="stylesheet" href="css/main.css" />
  <script>
    window.CESIUM_BASE_URL = "vendor/cesium/";
  </script>
</head>
<body>
  <aside id="sidebar">
    <h1 class="brand" id="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"></path>
          <path d="M4 7.5l8 4.5 8-4.5M12 12v9"></path>
        </svg>
      </span>
      <span class="brand-copy">
        <span class="brand-name">DasVisable</span>
        <span class="brand-subtitle">三维模型与检测分析平台</span>
      </span>
    </h1>

    <section class="panel accordion" id="modelPanel">
      <button class="panel-title accordion-toggle" type="button" aria-expanded="false" aria-controls="modelPanelBody">
        <span class="panel-title-label">
          <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"></path>
            <path d="M4 7.5l8 4.5 8-4.5M12 12v9"></path>
          </svg>
          <span>模型选择</span>
        </span>
        <svg class="panel-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 9l6 6 6-9"></path>
        </svg>
      </button>
      <div class="panel-body" id="modelPanelBody" aria-hidden="true">
        <div class="panel-body-inner">
          <div class="model-group" id="modelGroup" role="group" aria-label="模型选择"></div>
          <div class="panel-subsection">
            <h3 class="subsection-title">点云显示</h3>
            <div class="point-cloud-group" id="pointCloudGroup" role="group" aria-label="点云显示选项"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel accordion" id="detectionPanel">
      <button class="panel-title accordion-toggle" type="button" aria-expanded="false" aria-controls="detectionPanelBody">
        <span class="panel-title-label">
          <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="7" width="18" height="12" rx="2"></rect>
            <path d="M7 7V5h2M15 7V5h2M7 19v2h2M15 19v2h2"></path>
          </svg>
          <span>检测框选择</span>
        </span>
        <svg class="panel-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 9l6 6 6-9"></path>
        </svg>
      </button>
      <div class="panel-body" id="detectionPanelBody" aria-hidden="true">
        <div class="panel-body-inner">
          <div class="detection-group" id="detectionGroup" role="group" aria-label="检测框选择">
            <label class="detection-toggle detection-master">
              <input type="checkbox" id="detectionToggleAll" checked />
              <span>全部显示</span>
              <span class="toggle-switch" aria-hidden="true"></span>
            </label>
          </div>
        </div>
      </div>
    </section>

    <section class="panel accordion" id="planePanel">
      <button class="panel-title accordion-toggle" type="button" aria-expanded="false" aria-controls="planePanelBody">
        <span class="panel-title-label">
          <svg class="panel-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3l2 5h7l-5.5 4 2 7-5.5-3.5L6.5 19l2-7L3 8h7z"></path>
          </svg>
          <span>平面选择</span>
        </span>
        <svg class="panel-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 9l6 6 6-9"></path>
        </svg>
      </button>
      <div class="panel-body" id="planePanelBody" aria-hidden="true">
        <div class="panel-body-inner">
          <div class="plane-tools" role="group" aria-label="平面选择工具">
            <button id="planeMeasureToggle" class="plane-action" type="button">开始选择平面</button>
            <button id="planeMeasureClear" class="plane-action plane-action-secondary" type="button" disabled>清除</button>
          </div>
          <p id="planeMeasureHint" class="plane-hint">依次点击四个点，围成一个闭合四边形。</p>
          <div id="planeMeasureResult" class="plane-result" hidden></div>
        </div>
      </div>
    </section>

    <div id="status" class="status-pill loading" role="status">
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text">正在初始化 Cesium...</span>
    </div>
  </aside>

  <main id="viewer-panel">
    <div id="cesiumContainer"></div>
    <div id="hint">鼠标左键旋转 · 滚轮缩放 · 右键平移</div>
    <aside id="featureInfo" class="feature-info" hidden aria-live="polite">
      <button id="featureInfoClose" class="feature-info-close" type="button" aria-label="关闭检测框信息">×</button>
      <h2 id="featureInfoTitle">检测框信息</h2>
      <div class="feature-info-toolbar">
        <label for="coordinateSystem">坐标显示</label>
        <select id="coordinateSystem" class="coordinate-system-select">
          <option value="wgs84">WGS84</option>
          <option value="cgcs123e">CGCS 123E</option>
        </select>
      </div>
      <div id="featureInfoBody"></div>
    </aside>
  </main>

  <script src="vendor/cesium/Cesium.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
